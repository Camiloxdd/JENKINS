version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://app:secret@db:5432/app?server_version=15"
      APP_ENV: dev
      APP_SECRET: "a1b2c3d4e5f6g7h8"
      JWT_PASSPHRASE: "super_secret_passphrase"

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://34.134.171.228:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
